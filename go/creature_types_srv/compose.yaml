services:
  web:
    image: tests/creature_types_service:latest
    depends_on:
      postgres:
        condition: service_healthy
    build: .
    ports:
      - "8088:8088"
    env_file:
      - local/env/.env

  postgres:
    container_name: postgres_container
    image: postgres:17.2
    volumes:
      - ./data/psql_data:/var/lib/postgresql/data
    environment:
          POSTGRES_DB: "postgres"
          POSTGRES_USER: "postgres"
          POSTGRES_PASSWORD: "test"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 4G
