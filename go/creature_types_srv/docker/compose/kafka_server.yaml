services:
  zoo:
    image: confluentinc/cp-zookeeper:7.7.2
    ports:
      - 2181:2181
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.7.2
    depends_on:
      - zoo
    ports:
      - 9092:9092
      - 9093:9093
    env_file:
      - ../env/kafka_settings.env
    healthcheck:
      test: nc -z localhost 9092 || exit -1
      start_period: 15s
      interval: 5s
      timeout: 10s
      retries: 10

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - 8080:8080
    depends_on:
      kafka:
        condition: service_healthy
    env_file:
      - ../env/kafka_ui_settings.env