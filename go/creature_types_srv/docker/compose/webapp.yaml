services:
  web:
    image: tests/creature_types_service:latest
    container_name: creature_types_service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elastic:
        condition: service_healthy
    build:
      context: ../../
      dockerfile: docker/builder/Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ./src
    ports:
      - "8088:8088"
      - "44044:44044"
    env_file:
      - ../env/webapp.env
