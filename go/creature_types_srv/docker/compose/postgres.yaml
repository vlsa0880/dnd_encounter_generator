services:
  postgres:
    image: postgres:17.2
    container_name: postgres_container
    volumes:
      - ../../data/psql_data:/var/lib/postgresql/data
    user: "${UID}:${GID}"
    env_file:
      - ../env/psql_settings.env
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 4G